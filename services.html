<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Core SEO Meta Tags -->
    <title>Gourmet Event Catering Services | Sne's Gourmet Table</title>
    <meta name="description" content="Explore luxury catering services by Sne's Gourmet Table. We provide bespoke menus, private chef services, corporate event catering, and wedding packages across South Africa.">
    <meta name="keywords" content="catering services, private chef, wedding catering, corporate event food, fine dining setups, boutique catering company">
    <meta name="author" content="Sne's Gourmet Table">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Luxury Event Catering Services | Sne's Gourmet Table">
    <meta property="og:description" content="Every occasion, perfectly catered. Filter through our bespoke luxury hospitality packages.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/images/og-services-preview.jpg">

    <!-- Google Fonts Links -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" class="logo-link">
                <span class="brand-name">Sne's Gourmet Table</span>
                <span class="tagline">CATERING EXCELLENCE</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html" class="active-nav" aria-current="page">Services</a>
            <a href="menu.html">Menu</a>
            <a href="testimonials.html">Testimonials</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="enquiry.html" class="btn-consultation">Book a consultation</a>
    </header>

    <!-- Services Section -->
    <main class="services-section">
        <header class="services-header">
            <div class="header-left">
                <h1 class="services-title">
                    Every occasion, <br>
                    <span class="italic-text">perfectly catered.</span>
                </h1>
            </div>
            <div class="header-right">
                <p class="services-intro">
                    Whether it's six guests or six hundred, we bring the same devotion to every table we set.
                </p>
            </div>
        </header>

        <!-- Dynamic Content Controls (Part 3 - Section 2.2 Alignment) -->
        <nav class="filter-controls" aria-label="Filter catering options">
            <button class="filter-btn active" data-filter="all">ALL SERVICES</button>
            <button class="filter-btn" data-filter="private">INTIMATE GATHERINGS</button>
            <button class="filter-btn" data-filter="corporate">PROFESSIONAL OCCASIONS</button>
            <button class="filter-btn" data-filter="wedding">YOUR SPECIAL DAY</button>
        </nav>

        <!-- Section 3.3: Optimized Responsive Image Grids Pointing to Local .jpeg Files -->
        <div class="services-grid" id="servicesGrid">
            
            <!-- Card 1: Intimate Gatherings -->
            <article class="service-card" data-category="private">
                <div class="card-image-wrapper">
                    <picture>
                        <source srcset="./images/intimate-gathering.jpeg" media="(min-width: 769px)">
                        <source srcset="./images/intimate-gathering.jpeg" media="(max-width: 768px)">
                        <img src="./images/intimate-gathering.jpeg" 
                             sizes="(max-width: 768px) 100vw, 33vw" 
                             alt="Plated fine dining layout" 
                             class="card-image">
                    </picture>
                </div>
                <h2 class="card-title">INTIMATE GATHERINGS</h2>
            </article>

            <!-- Card 2: Professional Occasions -->
            <article class="service-card" data-category="corporate">
                <div class="card-image-wrapper">
                    <picture>
                        <source srcset="./images/professional-event.jpeg" media="(min-width: 769px)">
                        <source srcset="./images/professional-event.jpeg" media="(max-width: 768px)">
                        <img src="./images/professional-event.jpeg" 
                             sizes="(max-width: 768px) 100vw, 33vw" 
                             alt="Gourmet catering buffet setup" 
                             class="card-image">
                    </picture>
                </div>
                <h2 class="card-title">PROFESSIONAL OCCASIONS</h2>
            </article>

            <!-- Card 3: Your Special Day -->
            <article class="service-card" data-category="wedding">
                <div class="card-image-wrapper">
                    <picture>
                        <source srcset="./images/wedding-day.jpeg" media="(min-width: 769px)">
                        <source srcset="./images/wedding-day.jpeg" media="(max-width: 768px)">
                        <img src="./images/wedding-day.jpeg" 
                             sizes="(max-width: 768px) 100vw, 33vw" 
                             alt="Wedding banquet reception decor" 
                             class="card-image">
                    </picture>
                </div>
                <h2 class="card-title">YOUR SPECIAL DAY</h2>
            </article>
            
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
